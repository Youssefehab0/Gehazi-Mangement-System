<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>تم تقديم الشكوى</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
    }

    /* Header */
    .header {
      position: relative;
      background-image: url('Screenshot 2025-04-05 062725.png');
      background-size: cover;
      background-position: center;
      height: 400px;
      color: white;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
    }

    .navbar {
      position: sticky;
      top: 0;
      background-color: rgba(0, 0, 0, 0.9);
      /* Darker background */
      color: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      transition: all 0.3s ease-in-out;
    }

    .hero-content {
      position: absolute;
      /* Change to absolute positioning */
      top: 50%;
      /* Center vertically */
      left: 50%;
      /* Center horizontally */
      transform: translate(-50%, -50%);
      /* Adjust position to truly center */
      z-index: 2;
      /* Ensure it appears above the overlay */
      text-align: center;
      /* Center text */
    }

    .navbar-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: auto;
      padding: 5px 15px;
      direction: rtl;
    }

    .logo a {
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
      text-decoration: none;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
      transition: all 0.3s ease-in-out;
    }

    .nav-links li a {
      color: #ddd;
      font-weight: bold;
      padding: 10px 15px;
      border-radius: 8px;
      transition: background-color 0.3s, color 0.3s;
      text-decoration: none;
    }

    .nav-links li a:hover,
    .nav-links li a.active {
      background-color: #04AA6D;
      color: white;
    }

    .hamburger {
      display: none;
      font-size: 26px;
      cursor: pointer;
      color: #fff;
    }

    .menu-toggle {
      display: none;
    }

    @media (max-width: 768px) {
      .nav-links {
        position: absolute;
        top: 60px;
        right: 0;
        background-color: rgba(0, 0, 0, 0.95);
        width: 100%;
        flex-direction: column;
        align-items: center;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .menu-toggle:checked~.nav-links {
        max-height: 500px;
        opacity: 1;
        pointer-events: auto;
        padding-bottom: 20px;
      }

      .hamburger {
        display: block;
      }
    }

    /* Success Message */
    .success {
      text-align: center;
      padding: 60px 20px;
    }

    .success .checkmark {
      font-size: 80px;
      color: green;
    }

    .success p {
      font-size: 28px;
      margin-top: 20px;
      color: #000;
    }

    /* Footer */
    .footer {
            background-color: #0a183d;
            color: white;
            padding: 30px 0;
            text-align: center;
        }
        .footer-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 60px;
            padding: 20px;
        }
        .footer-column h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }
        .footer-column p {
            margin: 5px 0;
            color: #ccc;
            cursor: pointer;
        }
        .footer-column p:hover {
            color: #fff;
        }
        .social-icons {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .social-icons i {
            font-size: 20px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .social-icons i:hover {
            color: #ddd;
        }
  </style>

</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="overlay"></div>
    <nav class="navbar">
      <div class="navbar-container">
        <div class="logo">
           <a href="#">جهازي</a> 
        </div> 
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="hamburger">
           <i class="fas fa-bars"></i>
           </label>
        <ul class="nav-links">
          <li><a href="Landing_Page.html">الرئيسية</a></li>
          <li><a href="newsPage.html" class="active">الأخبار</a></li>
          <li><a href="#">حول</a></li>
          <li><a href="ComplaintPage.html">تواصل</a></li>
          <li><a href="BookingPage.html">احجز دورك</a></li>
        </ul>
      </div>
    </nav>
    <div class="hero-content">
      <h1>التحقق من الشكوى </h1>
    </div>
  </div>
  <!-- Success Message -->
  <div class="success">
    <div class="checkmark"><img src="../assets/images/images (1).png" alt=""></div>
    <p>تم تقديم شكوتك بنجاح</p>
    <p>سوف يتم الرد في خلال أيام</p>
  </div>

  <!-- Footer -->
  
  <footer class="footer">
    <div class="footer-container">
        <div class="footer-column">
            <h3>عن جهازي</h3>
            <p>الخدمات الأكثر طلبًا</p>
            <p>فريقنا</p>
        </div>
        <div class="footer-column">
            <h3>تواصل</h3>
            <p>اتصل بنا</p>
            <p>مركز المساعدة</p>
        </div>
    </div>
    <div class="social-icons">
        <i class="fab fa-facebook"></i>
        <i class="fab fa-twitter"></i>
        <i class="fab fa-instagram"></i>
    </div>
    <div style="margin-top: 20px; font-size: 14px; color: #ccc;">
        &copy; 2025 جهازي - جميع الحقوق محفوظة
    </div>
</footer>

</body>
</html>
