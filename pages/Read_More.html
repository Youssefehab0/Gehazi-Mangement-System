<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة أنيقة</title>
    <link rel="stylesheet" href="styles.css">
    <style>
   body{
           font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f6f6f6;
            margin: 0;
            padding: 0;
            direction: rtl;
        }

.header {
      
      color: white;
      text-align: center;
      position: relative;
      
    }

    .oVerlay {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: rgba(0, 0, 0, 0.6);
    }

    .header h1 {
     
      font-size: 2em;
      position: relative;
      z-index: 2;
    }

    .header p {
      font-size: 1.2em;
      position: relative;
      z-index: 2;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      background-color: rgba(0, 0, 0, 0.9);
      color: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      transition: all 0.3s ease-in-out;
    }

    .navbar-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: auto;
      padding: 5px 15px;
      direction: rtl;
    }

    .logo a {
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
      text-decoration: none;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
      transition: all 0.3s ease-in-out;
    }

    .nav-links li a {
      color: #ddd;
      font-weight: bold;
      padding: 8px 15px;
      border-radius: 8px;
      transition: background-color 0.3s, color 0.3s;
      text-decoration: none;
    }

    .nav-links li a:hover,
    .nav-links li a.active {
      background-color: #04AA6D;
      color: white;
    }

    .hamburger {
      display: none;
      font-size: 26px;
      cursor: pointer;
      color: #fff;
    }

    .menu-toggle {
      display: none;
    }

    @media (max-width: 768px) {
      .nav-links {
        position: absolute;
        top: 60px;
        right: 0;
        background-color: rgba(0, 0, 0, 0.95);
        width: 100%;
        flex-direction: column;
        align-items: center;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .menu-toggle:checked ~ .nav-links {
        max-height: 500px;
        opacity: 1;
        pointer-events: auto;
        padding-bottom: 20px;
      }

      .hamburger {
        display: block;
      }
    }
p {
    max-width: 700px;
    margin: 20px auto;
}

.content-box {
    max-width: 650px;
    margin: auto;
    padding: 20px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
}

ul {
    list-style: none;
    padding: 0;
}

li {
    padding: 10px;
    font-size: 20px;
    font-weight: 500;
    color: #333;
}
main{
  margin: 150px;

}

    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
          <div class="logo"><a href="#">جهازي</a></div>
          <input type="checkbox" id="menu-toggle" class="menu-toggle" />
          <label for="menu-toggle" class="hamburger">&#9776;</label>
          <ul class="nav-links">
            <li><a href="Landing_Page.html">الرئيسية</a></li>
            <li><a href="ComplaintPage.html">تواصل</a></li>
            <li><a href="#">حول</a></li>
            <li><a href="newsPage.html">الأخبار</a></li>
            <li><a href="BookingPage.html">احجز دورك</a></li>
          </ul>
        </div>
      </nav>
    <main>
        <h1>خبر انقطاع المياة بمنطقة ال800 فدان</h1>
        <div class="content-box">
          <p>
             اليوم يؤسفنا إخباركم بأنه سيتم قطع المياة يوم الأثنين الموافق 12/5 عام 2025 وذلك لعدة أسباب خاصة بإصلاحات في هذة المنطقة</p>
        </div>
    </main>
</body>
</html>
